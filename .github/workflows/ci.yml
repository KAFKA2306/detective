name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Verify lockfile
        run: uv lock --check
      - name: Validate detector catalog
        run: uv run --locked python scripts/check_catalog.py
      - name: Validate note public-page parser
        run: uv run --locked python -m unittest tests/test_note_public_page_probe.py
      - name: Validate note recommendation candidate collector
        run: uv run --locked python -m unittest tests/test_collect_note_recommended_candidates.py
      - name: Validate confirmatory corpus selector
        run: uv run --locked python -m unittest tests/test_select_zenn_confirmatory_corpus.py
      - name: Validate confirmatory composition audit
        run: uv run --locked python -m unittest tests/test_audit_zenn_confirmatory_composition.py
      - name: Validate confirmatory entropy measurement
        run: uv run --locked python -m unittest tests/test_measure_zenn_confirmatory_entropy.py
      - name: Validate confirmatory detector drift measurement
        run: uv run --locked python -m unittest tests/test_measure_zenn_confirmatory_detector_drift.py
      - name: Validate confirmatory NCD time-distance analysis
        run: uv run --locked python -m unittest tests/test_analyze_zenn_confirmatory_ncd_time_distance.py
      - name: Validate confirmatory research summary
        run: uv run --locked python -m unittest tests/test_build_zenn_confirmatory_research_summary.py
      - name: Validate JSON
        run: |
          python -m json.tool site/data/baselines.json >/dev/null
          python -m json.tool site/data/detectors.json >/dev/null
          python -m json.tool site/data/compatibility.json >/dev/null
          python -m json.tool reports/zenn_confirmatory_detector_summary.json >/dev/null
          python -m json.tool reports/zenn_confirmatory_research_summary.json >/dev/null
      - name: Verify pasted-text privacy architecture
        run: node scripts/privacy_architecture_test.mjs
