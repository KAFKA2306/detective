name: OSS meta review

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
      - run: uv sync --locked
      - name: Refresh PyPI evidence
        run: uv run --locked python scripts/meta_review.py
      - name: Commit evidence refresh
        run: |
          if git diff --quiet -- site/data/detectors.json; then
            echo "No detector metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/detectors.json
          git commit -m "chore: refresh OSS meta review"
          git push
