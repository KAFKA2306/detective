name: Note recommended candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/collect_note_recommended_candidates.py
      - scripts/audit_note_recommended_candidate_metadata.py
      - tests/test_collect_note_recommended_candidates.py
      - tests/test_audit_note_recommended_candidate_metadata.py
      - .github/workflows/note-recommended-candidates.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Collect bounded recommendation candidates
        run: python scripts/collect_note_recommended_candidates.py
      - name: Audit candidate public-page metadata
        id: audit
        continue-on-error: true
        run: python scripts/audit_note_recommended_candidate_metadata.py
      - name: Validate artifacts
        if: always()
        run: |
          python -m json.tool reports/note_recommended_candidate_manifest.json >/dev/null
          python -m json.tool reports/note_recommended_candidate_metadata.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-recommended-candidate-evidence
          path: |
            reports/note_recommended_candidate_manifest.json
            reports/note_recommended_candidate_metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce metadata audit result
        if: always() && steps.audit.outcome != 'success'
        run: exit 1
