name: Note recommended candidate metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - reports/note_recommended_candidate_manifest.json
      - scripts/audit_note_recommended_candidate_metadata.py
      - scripts/select_note_high_engagement_sample.py
      - tests/test_audit_note_recommended_candidate_metadata.py
      - tests/test_select_note_high_engagement_sample.py
      - .github/workflows/note-recommended-candidates.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate frozen candidate manifest
        run: python -m json.tool reports/note_recommended_candidate_manifest.json >/dev/null
      - name: Audit candidate public-page metadata
        id: audit
        continue-on-error: true
        run: python scripts/audit_note_recommended_candidate_metadata.py
      - name: Validate metadata artifact
        if: always()
        run: python -m json.tool reports/note_recommended_candidate_metadata.json >/dev/null
      - name: Select matched upper-quartile engagement sample
        if: steps.audit.outcome == 'success'
        run: |
          python scripts/select_note_high_engagement_sample.py \
            reports/note_recommended_candidate_metadata.json \
            reports/note_high_engagement_selection.json
          python -m json.tool reports/note_high_engagement_selection.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-recommended-candidate-evidence
          path: |
            reports/note_recommended_candidate_manifest.json
            reports/note_recommended_candidate_metadata.json
            reports/note_high_engagement_selection.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce metadata audit result
        if: always() && steps.audit.outcome != 'success'
        run: exit 1
