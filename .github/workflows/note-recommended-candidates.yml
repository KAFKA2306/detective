name: Note recommended candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/collect_note_recommended_candidates.py
      - tests/test_collect_note_recommended_candidates.py
      - .github/workflows/note-recommended-candidates.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Collect bounded recommendation candidates
        run: python scripts/collect_note_recommended_candidates.py
      - name: Validate artifact
        run: python -m json.tool reports/note_recommended_candidate_manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: note-recommended-candidate-manifest
          path: reports/note_recommended_candidate_manifest.json
          if-no-files-found: error
          retention-days: 30
