name: Zenn article sitemap inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zenn_article_sitemap_inventory.py"
      - ".github/workflows/zenn-article-sitemap-inventory.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory official article sitemaps
        run: python scripts/zenn_article_sitemap_inventory.py
      - name: Commit inventory evidence
        if: success()
        run: |
          if git diff --quiet -- reports/zenn_article_sitemap_inventory.json; then
            echo "No inventory changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/zenn_article_sitemap_inventory.json
          git commit -m "chore: inventory Zenn article sitemaps"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
