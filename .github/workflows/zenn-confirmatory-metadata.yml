name: Zenn confirmatory metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_zenn_confirmatory_metadata.py"
      - "scripts/audit_zenn_confirmatory_composition.py"
      - ".github/workflows/zenn-confirmatory-metadata.yml"

permissions:
  contents: write

concurrency:
  group: zenn-confirmatory-metadata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect bounded public-page metadata
        run: python scripts/collect_zenn_confirmatory_metadata.py
      - name: Apply frozen confirmatory selector
        run: python scripts/select_zenn_confirmatory_corpus.py corpus/zenn_confirmatory_candidates.jsonl reports/zenn_confirmatory_selection.json
      - name: Audit selected-corpus composition
        run: python scripts/audit_zenn_confirmatory_composition.py
      - name: Validate generated JSON
        run: |
          python -m json.tool reports/zenn_confirmatory_collection.json >/dev/null
          python -m json.tool reports/zenn_confirmatory_selection.json >/dev/null
          python -m json.tool reports/zenn_confirmatory_composition.json >/dev/null
      - name: Commit metadata and selection manifests
        run: |
          git add corpus/zenn_confirmatory_candidates.jsonl reports/zenn_confirmatory_collection.json reports/zenn_confirmatory_selection.json reports/zenn_confirmatory_composition.json
          if git diff --cached --quiet; then
            echo "No confirmatory metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: collect confirmatory Zenn metadata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
