name: Zenn sitemap metadata pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zenn_sitemap_metadata_pilot.py"
      - ".github/workflows/zenn-sitemap-metadata-pilot.yml"

permissions:
  contents: write

concurrency:
  group: zenn-pilot-write
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build same-season historical metadata pilot
        run: python scripts/zenn_sitemap_metadata_pilot.py
      - name: Sync pinned pystylometry environment
        run: uv sync --project detectors/pystylometry --locked
      - name: Build derived metrics and fixed-length pilot baseline
        run: uv run --project detectors/pystylometry --locked python "$GITHUB_WORKSPACE/scripts/build_zenn_pystylometry_pilot_baseline.py"
      - name: Commit coherent pilot snapshot
        if: success()
        run: |
          git add \
            corpus/zenn_august_sitemap_pilot.jsonl \
            reports/zenn_august_sitemap_pilot_summary.json \
            corpus/zenn_august_pystylometry_metrics.jsonl \
            site/data/baselines.json
          if git diff --cached --quiet; then
            echo "No pilot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh coherent Zenn August pilot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
