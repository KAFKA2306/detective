name: Zenn sitemap metadata pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zenn_sitemap_metadata_pilot.py"
      - ".github/workflows/zenn-sitemap-metadata-pilot.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build same-season historical metadata pilot
        run: python scripts/zenn_sitemap_metadata_pilot.py
      - name: Commit metadata-only pilot
        if: success()
        run: |
          git add corpus/zenn_august_sitemap_pilot.jsonl reports/zenn_august_sitemap_pilot_summary.json
          if git diff --cached --quiet; then
            echo "No pilot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: freeze Zenn August sitemap metadata pilot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
