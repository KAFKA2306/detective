name: Zenn source probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zenn_source_probe.py"
      - ".github/workflows/zenn-source-probe.yml"
  schedule:
    - cron: "7 2 * * 1"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe robots and metadata source
        run: python scripts/zenn_source_probe.py
      - name: Commit source compatibility evidence
        if: success()
        run: |
          if git diff --quiet -- reports/zenn_source_status.json; then
            echo "No source metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/zenn_source_status.json
          git commit -m "chore: refresh Zenn source compatibility"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
